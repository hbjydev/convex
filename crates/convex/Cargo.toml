[package]
name = "convex"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "convex"
autotests = false
version = "0.1.0"

[features]
integration = ["convex-db/testing"]
embed-web = ["convex-api/embed-web"]

[[test]]
name = "integration_database"
path = "tests/database.rs"
required-features = ["integration"]

[dependencies]
convex-db = { workspace = true, features = ["postgres"] }
convex-auth = { workspace = true, features = ["postgres"] }
convex-app = { workspace = true, features = ["postgres"] }
convex-api.workspace = true
anyhow.workspace = true
axum.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
convex-workspaces.workspace = true
chrono.workspace = true
uuid.workspace = true
lettre.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
serde.workspace = true
sqlx.workspace = true
jsonschema.workspace = true
tower.workspace = true

[lints]
workspace = true

[[bin]]
name = "e2e-server"
path = "src/bin/e2e-server.rs"
required-features = ["integration"]
