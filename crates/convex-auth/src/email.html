<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Convex</title>
    <style>
      @media only screen and (max-width: 600px) {
        .canvas { padding: 24px 12px !important; }
        .content { padding: 28px 24px !important; }
        .heading { font-size: 26px !important; line-height: 34px !important; }
      }
      @media (prefers-color-scheme: dark) {
        .background { background-color: #141416 !important; }
        .card { background-color: #1b1b1f !important; border-color: #303036 !important; }
        .foreground { color: #e9e9ee !important; }
        .muted { color: #a0a0ad !important; }
        .code { background-color: #2b2b32 !important; color: #e9e9ee !important; }
        .divider { border-color: #303036 !important; }
        .link { color: #a5a5ff !important; }
      }
    </style>
  </head>
  <body class="background" style="margin: 0; padding: 0; width: 100%; background-color: #f7f7f8; -webkit-text-size-adjust: 100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="background" style="width: 100%; background-color: #f7f7f8;">
      <tr>
        <td align="center" class="canvas" style="padding: 48px 24px;">
          <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width: 100%; max-width: 600px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;">
            <tr>
              <td class="card" style="background-color: #ffffff; border: 1px solid #e5e5e9; border-radius: 8px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td class="content foreground" style="padding: 40px; color: #24242b; font-size: 16px; line-height: 26px; text-align: left; overflow-wrap: anywhere;">
                      <p class="foreground" style="margin: 0 0 40px; color: #24242b; font-size: 24px; line-height: 32px; font-weight: 700; letter-spacing: -0.7px;">Convex</p>
                      {{content}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td class="muted" style="padding: 24px 40px 0; color: #676773; font-size: 12px; line-height: 20px; text-align: left;">Convex &middot; Self-hosted issue tracking</td>
            </tr>
          </table>
          <!--[if mso]></td></tr></table><![endif]-->
        </td>
      </tr>
    </table>
  </body>
</html>
