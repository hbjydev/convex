convex:
  publicUrl: https://convex.example.com

global:
  fullnameOverride: convex-custom

controllers:
  main:
    containers:
      main:
        # Native list syntax keeps its order for Kubernetes variable expansion.
        env:
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: convex-db-app
                key: uri
          - name: CONVEX_SETUP_TOKEN
            valueFrom:
              secretKeyRef:
                name: convex-setup
                key: token
          - name: FIRST
            value: first
          - name: SECOND
            value: $(FIRST)-second
        envFrom:
          - configMapRef:
              name: convex-extra

route:
  main:
    kind: HTTPRoute
    hostnames:
      - convex.example.com
    parentRefs:
      - name: public
        namespace: gateways
