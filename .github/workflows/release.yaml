---
name: Release containers

on:
  push:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  versions:
    name: Get Versions
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      rust-version: ${{ steps.versions.outputs.rust-version }}
      node-version: ${{ steps.versions.outputs.node-version }}
      pnpm-version: ${{ steps.versions.outputs.pnpm-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-repo
        with:
          rust: false

      - name: Fetch versions via Mise
        id: versions
        run: |
          {
            echo "rust-version=$(mise tool rust --active)"
            echo "node-version=$(mise tool node --active)"
            echo "pnpm-version=$(mise tool pnpm --active)"
          } >> "${GITHUB_OUTPUT}"

  docker:
    name: Release container
    needs: versions
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      build-args: |
        RUST_VERSION=${{ needs.versions.outputs.rust-version }}
        NODE_VERSION=${{ needs.versions.outputs.node-version }}
        PNPM_VERSION=${{ needs.versions.outputs.pnpm-version }}
      cache: true
      file: Dockerfile
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=raw,value=rolling,enable=${{ github.event_name == 'release' }}
        type=ref,event=branch
      output: image
      platforms: linux/amd64,linux/arm64
      push: true
      sbom: true
      set-meta-annotations: true
      set-meta-labels: true
      sign: "true"
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm
    needs:
      - docker
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write # keyless Cosign signing of the published chart
      packages: write
    env:
      VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup toolchain
        uses: ./.github/actions/setup-repo
        with:
          rust: false

      - name: Pin the released image digests into the chart
        env:
          IMAGE_DIGEST: ${{ needs.release-controller.outputs.digest }}
        run: |
          yq -i ".controllers.main.containers.main.image.digest = \"${IMAGE_DIGEST}\"" charts/convex/values.yaml
          echo "pinned image -> ${IMAGE_DIGEST}"

      - name: Package Helm chart
        run: |
          helm package charts/convex \
            --version "${VERSION}" \
            --app-version "${VERSION}"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Helm chart to GHCR
        run: |-
          helm push "convex-${VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Sign the published chart with Cosign
        run: |-
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/charts/convex:${VERSION}"
