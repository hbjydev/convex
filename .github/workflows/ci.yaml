name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-helm:
    name: Check Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
      - name: Build chart dependencies
        run: mise run helm:deps
      - name: Lint, render and package the chart
        run: mise run check:helm

  check-rust:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Check Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
      - name: Check Rust
        run: mise run check:rust

  check-web:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Check Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - name: Check Web
        run: mise run check:web

  check-contract:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Check API contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          pnpm: 'true'
      - name: Check generated contracts without PostgreSQL
        run: mise run generate:check

  build-rust:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Build Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
      - name: Build Rust application and archive tests
        run: mise run test:rust:archive
      - name: Upload workspace tests
        uses: actions/upload-artifact@v4
        with:
          name: nextest-workspace
          path: target/nextest/workspace.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  build-bundle:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Build and check bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          pnpm: 'true'
      - name: Build and verify the embedded frontend
        run: mise run check:bundle

  coverage:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Coverage
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo

      - name: Generate coverage
        run: mise run test:rust:cov

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: lcov.info
          fail_ci_if_error: false

  test-rust:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Unit Tests
    needs: build-rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
      - name: Download workspace tests
        uses: actions/download-artifact@v4
        with:
          name: nextest-workspace
          path: target/nextest
      - name: Run unit tests from archive
        run: mise run test:rust:unit:from-archive
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-unit-results
          path: target/nextest/ci/junit.xml

  integration-test:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Rust Integration Tests
    needs: build-rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
      - name: Download workspace tests
        uses: actions/download-artifact@v4
        with:
          name: nextest-workspace
          path: target/nextest
      - name: Run integration tests from archive
        run: mise run test:rust:integration:from-archive
      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-integration-results
          path: target/nextest/ci/junit.xml
      - name: Stop local services
        if: always()
        run: mise run db:down

  test-web:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Test Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          rust: 'false'
          pnpm: 'true'
      - name: Unit tests
        run: mise run test:web

  test-e2e:
    if: >-
      ${{ !(startsWith(github.head_ref, 'release-please--')
      && github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Test browser-to-API integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-repo
        with:
          pnpm: 'true'
      - name: Install browser
        run: mise run test:e2e:install
      - name: Browser-to-API smoke tests
        run: mise run test:e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: web/test-results/
      - name: Stop local services
        if: always()
        run: mise run db:down
