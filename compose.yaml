name: convex

x-postgres: &postgres
  image: postgres:18.3-alpine
  environment:
    POSTGRES_USER: convex
    POSTGRES_PASSWORD: convex
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U convex"]
    interval: 2s
    timeout: 5s
    retries: 30

services:
  postgres:
    <<: *postgres
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: convex
      POSTGRES_DB: convex
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
  postgres-test:
    <<: *postgres
    profiles: ["test"]
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: convex
      POSTGRES_DB: convex_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql"]
  oidc-cp03:
    image: quay.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
    profiles: ["oidc"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://127.0.0.1:8083
      KC_HTTP_PORT: "8080"
    ports: ["127.0.0.1:8083:8080"]
    volumes: ["./dev/oidc/convex-realm.json:/opt/keycloak/data/import/convex-realm.json:ro"]
  mailpit:
    image: axllent/mailpit:v1.30.7
    profiles: ["mail"]
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  postgres-data:
