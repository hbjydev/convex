[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
async-trait = "0.1.89"
mockall = "0.14.0"
thiserror = "2.0"
convex-core = { path = "crates/convex-core" }
convex-api = { path = "crates/convex-api" }
http = "1.0"
convex-db = { path = "crates/convex-db" }
convex-auth = { path = "crates/convex-auth" }
convex-workspaces = { path = "crates/convex-workspaces" }
convex-issues = { path = "crates/convex-issues" }
convex-app = { path = "crates/convex-app" }
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
argon2 = "0.5.3"
sha2 = "0.10.9"
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "ring", "webpki-roots"] }
anyhow = "1.0.104"
jsonschema = { version = "0.33", default-features = false }
axum = "0.8.9"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
mime_guess = "2.0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "uuid", "chrono"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
